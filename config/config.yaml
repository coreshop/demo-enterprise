imports:
    - { resource: services.yaml }
    - { resource: 'local/' }

pimcore:
    # generate with vendor/bin/generate-defuse-key; the demo registration (license.pimcore.com/register) is
    # bound to the identifier + secret pair, so all three values travel together
    encryption:
        secret: '%env(PIMCORE_ENCRYPTION_SECRET)%'
    product_registration:
        instance_identifier: '%env(PIMCORE_INSTANCE_IDENTIFIER)%'
        product_key: '%env(PIMCORE_PRODUCT_KEY)%'

lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%' # required for token creation
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%' # required for token verification
    pass_phrase: '%env(JWT_PASSPHRASE)%' # required for token creation
    token_ttl: 3600 # in seconds, default is 3600

core_shop_store:
    resources:
        store:
            classes:
                model: App\Entity\Store

doctrine:
    orm:
        mappings:
            app:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App


pimcore_studio_backend:
    mercure_settings:
        jwt_key: '%env(MERCURE_JWT_KEY)%'
        hub_url_client: '%env(MERCURE_URL)%'
        hub_url_server: '%env(MERCURE_SERVER_URL)%'
