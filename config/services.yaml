parameters:
    secret: '%env(APP_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $batchTaskRepository: '@coreshop_batch_messenger.repository.task'
            $batchZipStorage: '@coreshop_batch_messenger.zip.storage'

    App\Controller\:
        resource: '../src/Controller'
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Command\:
        resource: '../src/Command/*'
        tags: [ 'console.command' ]

    App\EventListener\:
        resource: '../src/EventListener/'

    Twig\DeferredExtension\DeferredExtension: ~
    # coreshop/enterprise-subscription-bundle 2026.2.0 registers its Studio build provider without the
    # BuildArchiveExtractor setter call (autowire is off in its studio.yaml), which breaks every
    # /pimcore-studio request. Re-declare the service here until the bundle ships the fix.
    CoreShop\Bundle\EnterpriseSubscriptionBundle\Studio\WebpackEntryPointProvider:
        autowire: false
        autoconfigure: false
        calls:
            - [setBuildArchiveExtractor, ['@Pimcore\Bundle\StudioUiBundle\Build\BuildArchiveExtractor']]
        tags:
            - { name: pimcore_studio_ui.webpack_entry_point_provider }

    # coreshop/headless-bundle 2026.2.0 type-hints the concrete CartItemQuantityModifier, which
    # coreshop/ticketing-bundle decorates with an interface-only class; see the class for details.
    App\Order\Modifier\DecoratedCartItemQuantityModifier:
        arguments:
            - '@coreshop.cart_item.quantity_modifier'

    CoreShop\Bundle\HeadlessBundle\CommandHandler\UpdateOrderItemHandler:
        autowire: false
        autoconfigure: false
        arguments:
            - '@coreshop.repository.order'
            - '@coreshop.repository.order_item'
            - '@App\Order\Modifier\DecoratedCartItemQuantityModifier'
            - '@CoreShop\Component\Order\Manager\CartManagerInterface'
            - '@validator'
            - '@CoreShop\Bundle\HeadlessBundle\Query\ExtensionHandler'
        tags:
            - { name: messenger.message_handler, bus: coreshop_headless.bus }
