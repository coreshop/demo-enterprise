name: coreshop-enterprise-demo

networks:
    cors_dev:
        external: true

services:
    db:
        image: mysql:8
        networks:
            - default
        command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci, --max-allowed-packet=512M]
        volumes:
            - database:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore

    nginx:
        image: nginx:stable-alpine
        volumes:
            - .:/var/www/html:cached
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
            - php-debug
            - mercure
        links:
            - php:fpm
            - php-debug:fpm-debug
        networks:
            - default
            - cors_dev
        labels:
            - traefik.enable=true
            - traefik.http.routers.coreshop_enterprise_demo.rule=Host(`coreshop-enterprise-demo.localhost`, `coreshop-enterprise-b2b-demo.localhost`)
            - traefik.http.routers.coreshop_enterprise_demo.entrypoints=cors_dev
            - traefik.http.routers.coreshop_enterprise_demo.tls=true
            - traefik.http.services.coreshop_enterprise_demo.loadbalancer.server.port=80
            - traefik.docker.network=cors_dev

    php:
        image: ghcr.io/cors-gmbh/pimcore-docker/php-fpm:8.4-alpine3.21-7.1.11
        networks:
            - default
        environment:
            - COMPOSER_AUTH=${COMPOSER_AUTH:-}
            - MERCURE_URL=https://coreshop-enterprise-demo.localhost/hub
        depends_on:
            - db
            - opensearch
            - mercure
        volumes:
            - .:/var/www/html:cached

    php-debug:
        image: ghcr.io/cors-gmbh/pimcore-docker/php-fpm-debug:8.4-alpine3.21-7.1.11
        networks:
            - default
        depends_on:
            - db
            - opensearch
            - mercure
        volumes:
            - .:/var/www/html:cached
        environment:
            PHP_IDE_CONFIG: "serverName=localhost"
            COMPOSER_AUTH: ${COMPOSER_AUTH:-}
            MERCURE_URL: https://coreshop-enterprise-demo.localhost/hub

    supervisord:
        image: ghcr.io/cors-gmbh/pimcore-docker/php-supervisord:8.4-alpine3.21-7.1.11
        depends_on:
            - db
            - opensearch
        volumes:
            - ./:/var/www/html:cached
            - ./.docker/supervisord/coreshop.conf:/etc/supervisor/conf.d/coreshop.conf:ro
            - ./.docker/supervisord/pimcore.conf:/etc/supervisor/conf.d/pimcore.conf:ro
        networks:
            - default

    opensearch:
        image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.11.1}
        environment:
            discovery.type: single-node
            node.name: opensearch
            OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
            plugins.security.disabled: 'true'
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        networks:
            - default
        volumes:
            - opensearch-data:/usr/share/opensearch/data

    mercure:
        image: dunglas/mercure:latest
        networks:
            - default
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: coreshop-enterprise-demo-mercure-change-me
            MERCURE_SUBSCRIBER_JWT_KEY: coreshop-enterprise-demo-mercure-change-me
        command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
        volumes:
            - mercure-data:/data
            - mercure-config:/config

    gotenberg:
        image: gotenberg/gotenberg:8
        networks:
            - default

volumes:
    database:
    mercure-data:
    mercure-config:
    opensearch-data:
